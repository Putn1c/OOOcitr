<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор изысканий — ООО «ЦИТР»</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="card">
    <h1>Калькулятор изысканий</h1>
    <p class="subtitle">ООО «ЦИТР» — Центр инфраструктурных и транспортных решений</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/calculate" method="post">
        <label>Вид изысканий
            <select name="survey_type" required>
                {% for key, name in surveys.items() %}
                    <option value="{{ key }}">{{ name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Площадь участка, га
            <input type="number" name="area_ha" min="0.1" step="0.1" value="10" required>
        </label>

        <label>Категория сложности
            <select name="complexity" required>
                {% for key in complexity %}
                    <option value="{{ key }}">{{ key }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Регион
            <select name="region" required>
                {% for key in regions %}
                    <option value="{{ key }}">{{ key }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit">Рассчитать</button>
    </form>
</main>
</body>
</html>
